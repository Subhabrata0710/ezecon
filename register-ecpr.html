<!DOCTYPE html>
<!-- hehe -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Register | EZECON 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Register for 5th EZECON 2026 — East Zone Emergency Medicine Conference, 8-9 August 2026, Kolkata.">
  <link rel="stylesheet" href="style.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

  <div id="marquee-placeholder"></div>
  <div id="nav-placeholder"></div>

  <!-- PAGE BANNER -->
  <section class="page-header">
    <div class="container">
      <h1>E-CPR Workshop Registration</h1>
      <div class="divider"></div>
      <p>Secure your spot for the E-CPR Workshop</p>
    </div>
  </section>

  <!-- PRICING SECTION -->
  <section class="section">
    <div class="container">
      <div class="section-header animate-on-scroll">
        <h2>Registration Fee</h2>
        <div class="divider"></div>
      </div>

      <div class="pricing-table-container animate-on-scroll" style="text-align: center; padding: 30px;">
        <h3 style="color: var(--color-primary); font-size: 1.5rem;">E-CPR Workshop Fee: ₹5,000</h3>
      </div>

      <!-- REGISTRATION FORM -->
      <div class="register-card animate-on-scroll" id="register-form">
        <h3 class="text-center">Workshop Registration Form</h3>
        <p class="form-desc text-center">Please fill in your details to proceed to payment.</p>

        <div class="form-group-row">
          <div class="form-group">
            <label for="reg-name">Full Name *</label>
            <input id="reg-name" class="form-control" placeholder="Dr. Full Name" required>
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="reg-email">Email Address *</label>
            <input id="reg-email" type="email" class="form-control" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="reg-phone">Phone Number *</label>
            <input id="reg-phone" class="form-control" placeholder="+91 XXXXX XXXXX" required>
          </div>
        </div>

        <div class="form-group-row">
          <div class="form-group">
            <label for="reg-institution">Institution / Hospital *</label>
            <input id="reg-institution" class="form-control" placeholder="Hospital / Institution name" required>
          </div>
          <div class="form-group">
            <label for="reg-designation">Designation *</label>
            <input id="reg-designation" class="form-control" placeholder="Your designation" required>
          </div>
        </div>

        <div class="form-divider"></div>

        <div class="total-bar">
          <div class="total-label">Total Amount Payable:</div>
          <div class="total-value" id="total-display">₹5,000</div>
        </div>

        <button class="btn btn-primary w-100" id="reg-submit-btn" onclick="payAndRegisterECPR()"
          style="padding:18px;width:100%;margin-bottom:8px;">
          Proceed to Payment
        </button>

      </div>
    </div>
  </section>

  <style>
    .pricing-table-container {
      margin: 40px auto 60px;
      overflow-x: auto;
      background: #fff;
      padding: 2px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(11, 31, 58, 0.08);
    }

    .pricing-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', sans-serif;
    }

    .pricing-table th {
      background: var(--color-primary-dark, #0B1F3A);
      color: #fff;
      padding: 15px;
      text-align: left;
      font-weight: 600;
    }

    .pricing-table td {
      padding: 15px;
      border-bottom: 1px solid #e8edf2;
      color: #4a5568;
    }

    .tier-high td {
      background: #f8fafc;
      font-weight: 600;
      color: #0B1F3A;
    }

    .tier-2 td {
      background: #f0f7ff;
      color: #1B4F72;
    }

    .tier-spot td {
      background: #fffcf0;
    }

    .pricing-notes {
      padding: 20px;
      background: #f1f5f9;
      border-radius: 0 0 12px 12px;
      font-size: 0.85rem;
      color: #4a5568;
    }

    .form-group-row {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }

    .form-group-row .form-group {
      flex: 1;
    }

    .form-divider {
      height: 1px;
      background: #e8edf2;
      margin: 25px 0;
    }

    .form-options {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .form-checkbox input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .total-bar {
      background: var(--color-bg-alt, #f5f7fa);
      padding: 20px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px 0;
      border-left: 4px solid var(--color-accent);
    }

    .total-label {
      font-weight: 700;
      color: #0B1F3A;
    }

    .total-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-primary);
    }

    .register-card {
      max-width: 750px;
      margin: 0 auto;
    }

    @media(max-width:768px) {
      .form-group-row {
        flex-direction: column;
        gap: 15px;
      }

      .pricing-table {
        font-size: 0.85rem;
      }

      .pricing-table th,
      .pricing-table td {
        padding: 10px 8px;
      }

      .total-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>

  <div id="footer-placeholder"></div>
  <button class="back-to-top" aria-label="Back to top">↑</button>
  <script src="script.js"></script>
</body>

</html>
