<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EZECON 2026</title>
  <meta name="description" content="Login to your EZECON 2026 delegate dashboard.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <section class="page-header">
    <div class="container">
      <h1>Delegate Login</h1>
      <div class="divider"></div>
      <p>Access your dashboard &amp; abstract submission portal</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div style="max-width:450px;margin:0 auto;" class="animate-on-scroll">
        <div class="card card-premium" style="padding:2.5rem;">
          <h3 style="text-align:center;margin-bottom:1.5rem;">Login</h3>

          <div class="form-group" style="margin-bottom:1.2rem;">
            <label for="login-email" style="display:block;margin-bottom:6px;font-weight:600;font-size:0.9rem;">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="your@email.com" required>
          </div>

          <div class="form-group" style="margin-bottom:1.5rem;">
            <label for="login-password" style="display:block;margin-bottom:6px;font-weight:600;font-size:0.9rem;">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="Your password" required>
          </div>

          <button id="login-btn" class="btn btn-primary" style="width:100%;padding:14px;" onclick="loginUser()">Login</button>

          <div style="margin-top: 1rem; text-align: center;">
            <a href="images/ASG.pdf" download class="btn btn-outline" style="width:100%; padding:12px; font-size: 0.88rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
              📥 Download Abstract Guidelines
            </a>
          </div>

          <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--color-text-muted);">
            Don't have an account? <a href="register.html" style="color:var(--color-primary);text-decoration:underline;">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <button class="back-to-top" aria-label="Back to top">↑</button>
  <script src="script.js"></script>
</body>
</html>
